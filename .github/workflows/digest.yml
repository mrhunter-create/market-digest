name: Bản tin thị trường

on:
  schedule:
    # 23:00 UTC T2–T6 = 07:00 sáng Đài Bắc T3–T7. GitHub trễ đều 1,5–2 tiếng nên
    # bản tin thực tế lên ~08:30–09:00 — đúng lúc đọc, và đã gom được cả diễn biến
    # sau giờ đóng cửa Mỹ, phiên châu Á đang chạy, và hợp đồng tương lai.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:        # chạy tay từ tab Actions
  push:                     # sửa code là deploy lại trang ngay, không đợi tới sáng
    branches: [main]
    paths-ignore: ["public/data/**", "README.md"]

permissions:
  contents: write           # commit file data
  pages: write              # deploy GitHub Pages
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chỉ tổng hợp tin khi chạy theo lịch hoặc chạy tay. Push code thì bỏ qua,
      # nếu không bản tin buổi sáng sẽ bị thay bằng bản giữa phiên.
      - name: Tổng hợp bản tin
        if: github.event_name != 'push'
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL:    ${{ vars.LLM_MODEL }}
        run: node scripts/build.mjs

      - name: Lưu bản tin vào repo
        if: github.event_name != 'push'
        run: |
          git config user.name  "market-digest bot"
          git config user.email "actions@github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "bản tin $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
